<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prévia das animações do Goblin — Madruga Survival</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#10191b;color:#e8f1ee}header{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:12px 18px;background:#182b29;flex-wrap:wrap}header h1{font-size:18px;margin:0}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{background:#243e36;color:#fff;border:1px solid #659a78;border-radius:8px;padding:9px}main{position:relative;height:calc(100dvh - 98px);min-height:400px}canvas{display:block;width:100%;height:100%}.help{position:absolute;left:12px;bottom:12px;padding:12px;background:#0c191ccc;border-radius:8px;max-width:320px;font-size:13px}#status{font-size:13px;color:#b9dfc3}@media(max-width:600px){main{height:calc(100dvh - 155px)}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><header><div><h1>🟢 Goblin — Laboratório de animações</h1><span id="status">Carregando GLB…</span></div><nav><label for="clip">Movimento</label><select id="clip"></select><button id="play" type="button">Pausar</button><label>Velocidade <input id="speed" type="range" min="0.3" max="2" step="0.1" value="1"></label></nav></header><main id="stage"><div class="help">Gire arrastando o mouse ou dedo. Zoom com roda ou pinça. Aqui você pode ver todas as 15 animações, inclusive os seis clipes originais. Os clipes de ataque não consomem vida nesta prévia.</div></main><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),status=document.getElementById('status'),picker=document.getElementById('clip');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#243536');const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(2.9,2.2,3.2);
const controls=new OrbitControls(cam,renderer.domElement);controls.target.set(0,.9,0);controls.enableDamping=true;controls.update();
scene.add(new THREE.HemisphereLight(0xccebd7,0x304339,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,6,4);light.castShadow=true;scene.add(light);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.08,48),new THREE.MeshStandardMaterial({color:0x405f46,roughness:.95}));floor.position.y=-.06;floor.receiveShadow=true;scene.add(floor);scene.add(new THREE.GridHelper(4,12,0x8aa990,0x486458));
let mixer=null,action=null,playing=true;const clock=new THREE.Clock();
const resize=()=>{const {clientWidth:w,clientHeight:h}=stage;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};new ResizeObserver(resize).observe(stage);resize();
try{const gltf=await new GLTFLoader().loadAsync('./assets/models/goblin_animado.glb');gltf.scene.traverse(n=>{if(n.isMesh)n.castShadow=true;});scene.add(gltf.scene);mixer=new THREE.AnimationMixer(gltf.scene);
 for(const clip of gltf.animations){const opt=document.createElement('option');opt.value=clip.name;opt.textContent=clip.name;picker.appendChild(opt)}
 picker.value='Idle';function play(name){if(action)action.fadeOut(.16);action=mixer.clipAction(gltf.animations.find(c=>c.name===name));action.reset().setLoop(THREE.LoopRepeat,Infinity).fadeIn(.16).play();}
 picker.addEventListener('change',()=>play(picker.value));play('Idle');status.textContent=`✓ ${gltf.animations.length} animações carregadas · modelo com esqueleto original`;
}catch(e){status.textContent='⚠ Modelo não carregou. Abra a prévia pelo servidor local, não diretamente por file://.';console.error(e);}
document.getElementById('play').onclick=ev=>{playing=!playing;ev.target.textContent=playing?'Pausar':'Reproduzir'};
const speed=document.getElementById('speed');function tick(){requestAnimationFrame(tick);if(playing)mixer?.update(Math.min(clock.getDelta(),.07)*Number(speed.value));else clock.getDelta();controls.update();renderer.render(scene,cam)}tick();
</script></body></html>
