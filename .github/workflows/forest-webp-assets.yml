name: Gerar WebP da vegetacao original
on:
  push:
    branches: [feat/forest-webp-lod-v257]
    paths:
      - scripts/generate-forest-webp.py
      - .github/workflows/forest-webp-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-vegetation:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar Blender e encoder WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libopengl0
          python -m pip install Pillow
      - name: Renderizar 8 vistas por modelo GLB original
        run: python scripts/generate-forest-webp.py
      - name: Salvar imagens reais na branch do PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vegetation/billboards/*.webp
          if git diff --cached --quiet; then
            echo "Sem imagens novas."
          else
            git commit -m "assets: WebP transparentes 8 angulos dos GLBs reais"
            git push
          fi
