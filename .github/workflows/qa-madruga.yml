name: QA do MadrugaCraft
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: npm run check
      - name: Reconstruir GLBs e executar regressão
        run: npm test
      - name: Regressão histórica modernizada
        run: npm run test:legacy
